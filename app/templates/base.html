<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ title or 'SamaBoutik Pro' }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="logo">SamaBoutik <span>Pro</span></div>
      <nav>
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
        <a href="{{ url_for('produits') }}">Produits</a>
        <a href="{{ url_for('ventes') }}">Ventes</a>
        <a href="#">Clients</a>
        <a href="#">Factures</a>
        <a href="#">Statistiques</a>
        <a href="#">Utilisateurs</a>
        <a href="#">Paramètres</a>
      </nav>
    </aside>

    <main class="content">
      <header class="topbar">
        <h1>{{ page_title }}</h1>
        <a class="btn" href="{{ url_for('rapport') }}">Voir le rapport</a>
      </header>
      {% block content %}{% endblock %}
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="{{ url_for('static', filename='js/charts.js') }}"></script>
</body>
</html>
